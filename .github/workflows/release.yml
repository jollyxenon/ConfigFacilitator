name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    name: Build GitHub release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    name: Publish npm package
    needs: goreleaser
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify npm version matches tag
        working-directory: npm
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::npm package version ${PKG_VERSION} does not match tag ${GITHUB_REF_NAME}; bump npm/package.json to ${GITHUB_REF_NAME#v} before tagging"
            exit 1
          fi
          echo "npm package version ${PKG_VERSION} matches tag ${GITHUB_REF_NAME}"

      - name: Publish to npm
        working-directory: npm
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "@jollyxenon/cfgfc@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::@jollyxenon/cfgfc@${PKG_VERSION} already published; skipping publish (release assets were rebuilt for this re-tagged version)"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
